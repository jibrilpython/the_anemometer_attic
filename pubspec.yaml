name: the_anemometer_attic
description: "A digital archive for collectors of mining ventilation antiquities — cataloging anemometers, manometers, hygrometers, and atmospheric measurement instruments."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.4
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#F3F4F6"
  adaptive_icon_foreground: "assets/images/icon.png"

flutter_native_splash:
  color: "#F3F4F6"
  image: "assets/images/logo.png"
  android_12:
    image: "assets/images/logo.png"
    color: "#F3F4F6"
